name: Gerar APK Competidor (RallyChrono)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configurar Java 21 (requisito Capacitor Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar dependências
        run: npm install

      - name: Compilar modo exclusivo Competidor e sincronizar Android
        run: npm run cap:sync

      - name: Dar permissão de execução ao Gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK Debug (pronto para instalar no Android)
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: RallyChrono-Coletor-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
