name: Gerar APK Competidor (PitStop)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Configurar Java 21 (requisito Capacitor Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar dependências
        run: npm install

      - name: Compilar modo exclusivo Competidor e sincronizar Android
        run: npm run cap:sync

      - name: Dar permissão de execução ao Gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK Debug (pronto para instalar no Android)
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PitStop.apk

      - name: Disponibilizar APK nos Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PitStop-APK
          path: PitStop.apk
          retention-days: 30

      - name: Publicar APK na aba Releases (Link Público)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: PitStop (Última Versão)
          files: PitStop.apk
